[package]
name        = "portman"
version     = "0.2.3"
edition     = "2021"
authors     = ["bg-phunon <bg.phunon@gmail.com>"]
description = "TUI tool for monitoring and managing processes listening on TCP ports"
license     = "MIT"
repository  = "https://github.com/bg-phunon/portman"
homepage    = "https://github.com/bg-phunon/portman"
readme      = "README.md"
keywords    = ["tui", "port", "process", "network", "cli"]
categories  = ["command-line-utilities", "network-programming"]

[dependencies]
ratatui    = "0.29"
crossterm  = "0.28"
sysinfo    = "0.32"
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
